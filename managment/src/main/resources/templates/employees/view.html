
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Details</title>
</head>
<body>

<h1>Employee Details</h1>

<table border="1">
    <tr>
        <th>Employee ID</th>
        <td th:text="${employee.employeeId}"></td>
    </tr>
    <tr>
        <th>Employee Code</th>
        <td th:text="${employee.employeeCode}"></td>
    </tr>
    <tr>
        <th>First Name</th>
        <td th:text="${employee.firstName}"></td>
    </tr>
    <tr>
        <th>Last Name</th>
        <td th:text="${employee.lastName}"></td>
    </tr>
    <tr>
        <th>Email</th>
        <td th:text="${employee.email}"></td>
    </tr>
    <tr>
        <th>Phone Number</th>
        <td th:text="${employee.phoneNo}"></td>
    </tr>
    <tr>
        <th>Department</th>
        <td th:text="${employee.department}"></td>
    </tr>
    <tr>
        <th>Designation</th>
        <td th:text="${employee.designation}"></td>
    </tr>
    <tr>
        <th>Salary</th>
        <td th:text="${employee.salary}"></td>
    </tr>
    <tr>
        <th>Joining Date</th>
        <td th:text="${employee.joiningDate}"></td>
    </tr>
    <tr>
        <th>Status</th>
        <td th:text="${employee.status}"></td>
    </tr>
</table>

<p>
    <a th:href="@{/ui/employees}">Back to Employee List</a>
</p>

<a th:href="@{/ui/employees/{id}/edit(id=${employee.employeeId})}">
    Edit Employee
</a>

</body>
</html>
