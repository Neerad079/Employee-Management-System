<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>List of All Employees</title>
</head>
<body>
<p th:if="${successMessage}"
   th:text="${successMessage}"></p>

<h1>Employee Management System</h1>
<h2>All Employees</h2>
<a th:href="@{/ui/employees/new}">
    + Add Employee
</a>
<table border="1">
    <thead>

    <tr>
        <th>Actions</th>
        <th>Code</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Department</th>
        <th>Designation</th>
        <th>Salary</th>
        <th>Joining Date</th>
        <th>Status</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="emp: ${employees}">

        <td>
            <a th:href="@{/ui/employees/{id}(id=${emp.employeeId})}">
                View
            </a>

            <a th:href="@{/ui/employees/{id}/edit(id=${emp.employeeId})}">
                Edit
            </a>

            <form th:action="@{/ui/employees/{id}/delete(id=${emp.employeeId})}"
                  method="post"
                  style="display: inline;"
                  onsubmit="return confirm('Are you sure you want to delete this employee?');">

                <button type="submit">Delete</button>

            </form>

        </td>

        <td th:text="${emp.employeeCode}"></td>
        <td th:text="${emp.firstName}"></td>
        <td th:text="${emp.lastName}"></td>
        <td th:text="${emp.email}"></td>
        <td th:text="${emp.phoneNo}"></td>
        <td th:text="${emp.department}"></td>
        <td th:text="${emp.designation}"></td>
        <td th:text="${emp.salary}"></td>
        <td th:text="${emp.joiningDate}"></td>
        <td th:text="${emp.status}"></td>

    </tr>
    </tbody>
</table>

<p th:if="${#lists.isEmpty(employees)}">
    No Employee Found
</p>
</body>
</html>
