<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

    <div class="header">
        <div class="title-group">
            <h1>Employee Management System</h1>
            <p>Directory of all registered employees</p>
        </div>
        <a class="btn btn-primary" th:href="@{/ui/employees/new}">+ Add Employee</a>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Actions</th>
                    <th>Code</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Salary</th>
                    <th>Joining Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="emp: ${employees}">
                    <td>
                        <div class="actions-cell">
                            <a class="btn btn-secondary btn-sm" th:href="@{/ui/employees/{id}(id=${emp.employeeId})}">View</a>
                            <a class="btn btn-secondary btn-sm" th:href="@{/ui/employees/{id}/edit(id=${emp.employeeId})}">Edit</a>
                            <form th:action="@{/ui/employees/{id}/delete(id=${emp.employeeId})}"
                                  method="post"
                                  style="display: inline;"
                                  onsubmit="return confirm('Are you sure you want to delete this employee?');">
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </div>
                    </td>
                    <td th:text="${emp.employeeCode}"></td>
                    <td th:text="${emp.firstName}"></td>
                    <td th:text="${emp.lastName}"></td>
                    <td th:text="${emp.email}"></td>
                    <td th:text="${emp.phoneNo}"></td>
                    <td th:text="${emp.department}"></td>
                    <td th:text="${emp.designation}"></td>
                    <td th:text="${emp.salary}"></td>
                    <td th:text="${emp.joiningDate}"></td>
                    <td>
                        <span th:text="${emp.status}" 
                              th:class="${emp.status == 'Active' ? 'badge badge-active' : 'badge badge-inactive'}">
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(employees)}" class="empty-state">
        <p>No employees found. Click <strong>+ Add Employee</strong> to create your first record.</p>
    </div>
</div>

</body>
</html>
