<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Employee' : 'Add Employee'">Add Employee</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container" style="max-width: 750px;">
    <div class="header">
        <div class="title-group">
            <h1 th:text="${isEdit} ? 'Edit Employee' : 'Add New Employee'">Add Employee</h1>
            <p>Please enter the employee details below</p>
        </div>
        <a class="btn btn-secondary btn-sm" th:href="@{/ui/employees}">Back to Directory</a>
    </div>

    <form th:action="${isEdit}
              ? @{/ui/employees/{id}/edit(id=${employee.employeeId})}
              : @{/ui/employees}"
          th:object="${employee}"
          method="post">

        <div class="form-grid">
            <div class="form-group">
                <label for="employeeCode">Employee Code</label>
                <input type="number"
                       id="employeeCode"
                       th:field="*{employeeCode}"
                       placeholder="e.g. 101"
                       required>
                <p class="error-msg"
                   th:if="${#fields.hasErrors('employeeCode')}"
                   th:errors="*{employeeCode}"></p>
            </div>

            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text"
                       id="firstName"
                       th:field="*{firstName}"
                       placeholder="e.g. John"
                       required>
                <p class="error-msg"
                   th:if="${#fields.hasErrors('firstName')}"
                   th:errors="*{firstName}"></p>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text"
                       id="lastName"
                       th:field="*{lastName}"
                       placeholder="e.g. Doe"
                       required>
                <p class="error-msg"
                   th:if="${#fields.hasErrors('lastName')}"
                   th:errors="*{lastName}"></p>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email"
                       id="email"
                       th:field="*{email}"
                       placeholder="e.g. john.doe@example.com"
                       required>
                <p class="error-msg"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}"></p>
            </div>

            <div class="form-group">
                <label for="phoneNo">Phone Number</label>
                <input type="text"
                       id="phoneNo"
                       th:field="*{phoneNo}"
                       inputmode="numeric"
                       maxlength="10"
                       placeholder="10-digit mobile number"
                       required>
                <p class="error-msg"
                   th:if="${#fields.hasErrors('phoneNo')}"
                   th:errors="*{phoneNo}"></p>
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <input type="text"
                       id="department"
                       th:field="*{department}"
                       placeholder="e.g. Engineering"
                       required>
                <p class="error-msg"
                   th:if="${#fields.hasErrors('department')}"
                   th:errors="*{department}"></p>
            </div>

            <div class="form-group">
                <label for="designation">Designation</label>
                <input type="text"
                       id="designation"
                       th:field="*{designation}"
                       placeholder="e.g. Software Engineer"
                       required>
                <p class="error-msg"
                   th:if="${#fields.hasErrors('designation')}"
                   th:errors="*{designation}"></p>
            </div>

            <div class="form-group">
                <label for="salary">Salary</label>
                <input type="number"
                       id="salary"
                       th:field="*{salary}"
                       min="0"
                       step="any"
                       placeholder="e.g. 75000"
                       required>
                <p class="error-msg"
                   th:if="${#fields.hasErrors('salary')}"
                   th:errors="*{salary}"></p>
            </div>

            <div class="form-group">
                <label for="joiningDate">Joining Date</label>
                <input type="date"
                       id="joiningDate"
                       th:field="*{joiningDate}"
                       required>
                <p class="error-msg"
                   th:if="${#fields.hasErrors('joiningDate')}"
                   th:errors="*{joiningDate}"></p>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" th:field="*{status}" required>
                    <option value="">Select status</option>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
                <p class="error-msg"
                   th:if="${#fields.hasErrors('status')}"
                   th:errors="*{status}"></p>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit"
                    class="btn btn-primary"
                    th:text="${isEdit} ? 'Update Employee' : 'Save Employee'">
                Save Employee
            </button>
            <a class="btn btn-secondary" th:href="@{/ui/employees}">Cancel</a>
        </div>

    </form>
</div>

</body>
</html>
