
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>
</head>
<body>

<h1 th:text="${isEdit} ? 'Edit Employee' : 'Add Employee'">
    Add Employee
</h1>

<form th:action="${isEdit}
          ? @{/ui/employees/{id}/edit(id=${employee.employeeId})}
          : @{/ui/employees}"
      th:object="${employee}"
      method="post">

    <div>
        <label for="employeeCode">Employee Code</label>
        <input type="number"
               id="employeeCode"
               th:field="*{employeeCode}"
               required>
        <p th:if="${#fields.hasErrors('employeeCode')}"
           th:errors="*{employeeCode}"></p>
    </div>

    <div>
        <label for="firstName">First Name</label>
        <input type="text"
               id="firstName"
               th:field="*{firstName}"
               required>
        <p th:if="${#fields.hasErrors('firstName')}"
           th:errors="*{firstName}"></p>
    </div>

    <div>
        <label for="lastName">Last Name</label>
        <input type="text"
               id="lastName"
               th:field="*{lastName}"
               required>
        <p th:if="${#fields.hasErrors('lastName')}"
           th:errors="*{lastName}"></p>
    </div>

    <div>
        <label for="email">Email</label>
        <input type="email"
               id="email"
               th:field="*{email}"
               required>
        <p th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}"></p>
    </div>

    <div>
        <label for="phoneNo">Phone Number</label>
        <input type="text"
               id="phoneNo"
               th:field="*{phoneNo}"
               inputmode="numeric"
               maxlength="10"
               required>
        <p th:if="${#fields.hasErrors('phoneNo')}"
           th:errors="*{phoneNo}"></p>
    </div>

    <div>
        <label for="department">Department</label>
        <input type="text"
               id="department"
               th:field="*{department}"
               required>
        <p th:if="${#fields.hasErrors('department')}"
           th:errors="*{department}"></p>
    </div>

    <div>
        <label for="designation">Designation</label>
        <input type="text"
               id="designation"
               th:field="*{designation}"
               required>
        <p th:if="${#fields.hasErrors('designation')}"
           th:errors="*{designation}"></p>
    </div>

    <div>
        <label for="salary">Salary</label>
        <input type="number"
               id="salary"
               th:field="*{salary}"
               min="0"
               step="any"
               required>
        <p th:if="${#fields.hasErrors('salary')}"
           th:errors="*{salary}"></p>
    </div>

    <div>
        <label for="joiningDate">Joining Date</label>
        <input type="date"
               id="joiningDate"
               th:field="*{joiningDate}"
               required>
        <p th:if="${#fields.hasErrors('joiningDate')}"
           th:errors="*{joiningDate}"></p>
    </div>

    <div>
        <label for="status">Status</label>
        <select id="status" th:field="*{status}" required>
            <option value="">Select status</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>
        <p th:if="${#fields.hasErrors('status')}"
           th:errors="*{status}"></p>
    </div>

    <button type="submit"
            th:text="${isEdit} ? 'Update Employee' : 'Save Employee'">
        Save Employee
    </button>

    <a th:href="@{/ui/employees}">Cancel</a>

</form>

</body>
</html>
