server:
  port: 8080

spring:
  application:
    name: employee-management

  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: password # Replace with your MySQL password
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update # Automatically updates the database schema based on entities
    show-sql: true # Prints executed SQL queries in the console
    properties:
      hibernate:
        format_sql: true # Formats the printed SQL queries

    open-in-view: false

  # Thymeleaf Configuration (Template Engine)
  thymeleaf:
    cache: false # Disable caching for development so template changes reflect immediately
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
